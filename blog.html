<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b0b1b" />
  <title>Blog | Márcia Luciana — Geração Consciente</title>
  <meta name="description" content="Conteúdos sobre diálogo em família, educação para a sexualidade e proteção da infância, por Márcia Luciana." />
  <link rel="canonical" href="https://www.marcialuciana.com.br/blog.html" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css?v=8" />
  <script src="assets/js/pixel.js"></script>
</head>
<body>
  <!-- HEADER -->
  <header class="header" id="topo">
    <div class="container header__inner">
      <a href="index.html" class="brand" aria-label="Márcia Luciana - página inicial"><b>MÁRCIA</b> <span>LUCIANA</span></a>
      <nav class="nav" id="nav" aria-label="Navegação principal">
        <a href="index.html#metodo">Método</a>
        <a href="index.html#cursos">Materiais</a>
        <a href="index.html#sobre">Sobre</a>
        <a href="index.html#escolas">Escolas</a>
        <a href="blog.html">Blog</a>
        <a href="index.html#cursos" class="btn">Ver materiais</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- SUB-HERO -->
    <section class="subhero">
      <div class="container">
        <p class="eyebrow eyebrow--center eyebrow--light">Blog</p>
        <h1>Conteúdos para <span class="serif">fortalecer o diálogo</span> em família.</h1>
        <p>Textos sobre corpo, emoções, limites, proteção e as conversas que transformam gerações.</p>
      </div>
    </section>

    <!-- LISTA DE POSTS -->
    <section class="section">
      <div class="container">
        <div id="blog-grid" class="blog-grid" aria-live="polite">
          <p id="blog-loading" class="blog-empty">Carregando conteúdos…</p>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer" id="contato">
    <div class="container">
      <div class="footer__bottom" style="border:0;justify-content:center;text-align:center">
        <span>© <span id="ano"></span> Márcia Luciana de Oliveira — Geração Consciente.</span>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('ano').textContent = new Date().getFullYear();
    function fmtData(d){ try { return new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'}); } catch(e){ return d; } }
    fetch('blog-posts/index.json?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(data){
        var posts = (data.posts || []).slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
        var grid = document.getElementById('blog-grid');
        if (!posts.length){ grid.innerHTML = '<p class="blog-empty">Em breve, novos conteúdos por aqui. 💛</p>'; return; }
        grid.innerHTML = posts.map(function(p){
          return '<article class="post-card">'
            + '<a class="post-card__link" href="post.html?p=' + encodeURIComponent(p.slug) + '">'
            + '<div class="post-card__body">'
            + '<span class="post-card__date">' + fmtData(p.date) + '</span>'
            + '<h2>' + p.title + '</h2>'
            + '<p>' + (p.excerpt || '') + '</p>'
            + '<span class="post-card__more">Ler mais →</span>'
            + '</div></a></article>';
        }).join('');
      })
      .catch(function(){
        document.getElementById('blog-grid').innerHTML = '<p class="blog-empty">Não foi possível carregar os conteúdos agora.</p>';
      });
  </script>
</body>
</html>
